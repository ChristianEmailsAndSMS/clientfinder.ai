<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Clientfinder.ai</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sign in · Clientfinder.ai">
  <meta property="og:description" content="Sign in or create a free Clientfinder.ai account.">
  <meta property="og:url" content="https://clientfinder.ai/">
  <meta name="twitter:title" content="Sign in · Clientfinder.ai">
  <meta name="twitter:description" content="Sign in or create a free Clientfinder.ai account.">
  <meta property="og:image" content="https://clientfinder.ai/assets/og.png">
  <meta property="og:site_name" content="clientfinder.ai">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://clientfinder.ai/assets/og.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="login">
  <main class="center">
    <div class="card auth glass">
      <a class="brand" href="/" aria-label="clientfinder.ai"><img src="/assets/logo.png" alt="clientfinder.ai" height="38"></a>
      <p class="tagline">Find clients the moment they post.</p>

      <p id="notice" class="error" hidden></p>

      <!-- sign in / create account -->
      <div id="v-main">
        <div class="tabs2" role="tablist">
          <button id="tab-in" role="tab" aria-controls="form-in" aria-selected="true" type="button" class="on">Sign in</button>
          <button id="tab-up" role="tab" aria-controls="form-up" aria-selected="false" type="button">Create account</button>
        </div>

        <form id="form-in" role="tabpanel" aria-labelledby="tab-in" autocomplete="on" novalidate>
          <label class="field">Email<input class="input" name="email" type="email" required autocomplete="username" autofocus></label>
          <label class="field">Password
            <span class="pwrow"><input class="input" name="password" type="password" aria-label="Password" required autocomplete="current-password" maxlength="256"><button type="button" class="link" data-show aria-label="Show password" aria-pressed="false">Show</button></span>
          </label>
          <label class="field" id="row-code" hidden>6-digit code from your authenticator app
            <input class="input" name="totp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456">
          </label>
          <p class="error" id="err-in" hidden></p>
          <button class="btn primary" type="submit" id="btn-in">Sign in</button>
          <p class="hint mt12"><button type="button" class="link" id="btn-forgot">Forgot password?</button></p>
          <p class="hint" id="forgot-note" hidden>Email <a href="mailto:christian@emailsandsms.com?subject=Reset%20my%20Clientfinder.ai%20password">christian@emailsandsms.com</a> from the address you signed up with and we will reset it for you.</p>
        </form>

        <form id="form-up" role="tabpanel" aria-labelledby="tab-up" autocomplete="on" novalidate hidden>
          <label class="field">Email<input class="input" name="email" type="email" required autocomplete="username"></label>
          <label class="field">Password
            <span class="pwrow"><input class="input" name="password" type="password" aria-label="Password" minlength="12" autocomplete="new-password" maxlength="256"><button type="button" class="link" data-show aria-label="Show password" aria-pressed="false">Show</button></span>
            <span class="hint">At least 12 characters. A few random words works well.</span>
          </label>
          <p class="error" id="err-up" hidden></p>
          <button class="btn primary" type="submit" id="btn-up">Create free account</button>
          <p class="hint mt12">Browsing the database is free. Credits are only used when you run your own search.</p>
        </form>
      </div>
    </div>
  </main>
  <script src="/assets/common.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
