<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Clientfinder Admin</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
</head>
<body>
  <main id="app">
    <p id="loading" class="muted">Loading…</p>

    <!-- D. dashboard -->
    <section id="v-dash" hidden>
      <header class="bar">
        <img src="/assets/logo.png" alt="" class="logo"><h1>Clientfinder admin</h1>
        <span class="grow"></span>
        <span id="who" class="muted"></span>
        <button id="btn-logout" class="ghost">Sign out</button>
        <button id="btn-logout-all" class="ghost" title="Invalidate every session for this account">Sign out everywhere</button>
      </header>
      <nav id="tabs" class="tabs">
        <button data-tab="overview" class="on">Overview</button>
        <button data-tab="sources">Sources</button>
        <button data-tab="failed">Failed URLs</button>
        <button data-tab="users">Customers &amp; credits</button>
        <button data-tab="security">Security log</button>
      </nav>
      <p id="flash" class="flash" hidden role="status"></p>
      <div id="tab-overview" class="tab"></div>
      <div id="tab-sources" class="tab" hidden></div>
      <div id="tab-failed" class="tab" hidden></div>
      <div id="tab-users" class="tab" hidden></div>
      <div id="tab-security" class="tab" hidden></div>
    </section>
  </main>
  <script src="/admin/assets/dashboard.js"></script>
</body>
</html>
